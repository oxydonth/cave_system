# Mosquitto for cave_system (concept sections 4.1 and 10). Mounted read-only at
# /mosquitto/config/mosquitto.conf; compose.yaml publishes the port on 127.0.0.1 only.

# One listener, on every interface of the container: the host side (127.0.0.1 for Home Assistant)
# and the Compose network (Zigbee2MQTT, the simulators) both reach it, and nothing else does.
listener 1883 0.0.0.0

# Password authentication only. The file is written by `./cave init` into CAVE_DATA/mosquitto,
# which is the container's /mosquitto/data.
allow_anonymous false
password_file /mosquitto/data/passwd

# Retained messages and subscriptions survive a restart; this is where Home Assistant's
# discovery messages live between starts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
