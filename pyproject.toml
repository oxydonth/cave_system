[project]
name = "cave-system"
version = "0.0.0"
description = "Local-first home automation for a flat in Germany, heating first."
readme = "README.md"
# Home Assistant 2026.10.4 refuses anything below 3.14.2, and uv cannot resolve with ">=3.14".
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    # Pins Home Assistant 2026.10.4. Bump together with the image tag in compose.yaml.
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff",
    "mypy",
    "types-PyYAML",
    "yamllint",
    # Read by the tests of the tracked YAML files in tests/ops, which also run without Home Assistant.
    "pyyaml",
    # Pre-built ShellCheck and actionlint binaries, so no system packages are needed.
    "shellcheck-py",
    "actionlint-py",
    # The client libraries of Home Assistant's MQTT and FRITZ!SmartHome integrations, pinned to
    # exactly the versions their manifests ask for (homeassistant/components/mqtt/manifest.json and
    # homeassistant/components/fritzbox/manifest.json in Home Assistant 2026.10.4). The test library
    # does not install integration requirements; it happens to require paho-mqtt itself, but not
    # pyfritzhome. The simulator tests drive both real clients, and `make versions` checks the pins.
    # Bump together with Home Assistant; Dependabot ignores them.
    "paho-mqtt==2.1.0",
    "pyfritzhome==0.6.21",
    # The browser check of the heating dashboard in the end-to-end job (tests/e2e/test_dashboard_browser.py).
    "playwright==1.64.1",
    { include-group = "sim" },
]
# What the simulator image (sim/Dockerfile) installs, from uv.lock. All three are pinned by
# Home Assistant itself, so they move only together with Home Assistant.
sim = [
    "aiohttp",
    "paho-mqtt",
    "pyyaml",
]

[tool.uv]
# An application, not a distributable package: nothing here is built or installed.
package = false

[tool.pytest.ini_options]
# custom_components must be importable from the repository root, and cave_ops from ops/. Do not add
# custom_components/__init__.py: Home Assistant's loader needs a namespace package.
# ops/ and sim/ hold the importable packages cave_ops and cave_sim.
pythonpath = [".", "ops", "sim"]
testpaths = ["tests"]
# importlib: test files in different directories may share a basename.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
# The tests in tests/ops must also run on Python 3.11 (the `cave` command, standard library only),
# where the project does not install and --strict-config rejects asyncio_mode without
# pytest-asyncio. They run with their own ini file and --confcutdir=tests/ops: `make test-py311`.
# Do not name that file pytest.ini: pytest would find it on its own and silently use it instead
# of this configuration. That is why the root tests/conftest.py must not import Home Assistant:
# Home Assistant fixtures live in tests/cave_heating/conftest.py (and the integration test
# directories of later work packages).

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# Everything targets Python 3.14, except ops/ (the `cave` command-line tool) and tests/ops, which
# must run on the server's own Python, 3.11 or newer: their ruff.toml files extend this one and
# set `target-version = "py311"` (Ruff uses the closest config file). ops/ and `cave` also get
# their own `mypy --python-version 3.11` run in `make typecheck`. Nothing below is specific to
# 3.14 apart from these settings.
[tool.ruff]
target-version = "py314"
line-length = 100
# Anchored to the repository root: a bare "data" would also skip sim/cave_sim/data/ and the like.
extend-exclude = ["./.claude", "./data"]
# The `cave` entry point has no .py extension.
extend-include = ["cave"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "ASYNC",    # blocking calls in async code
    "T20",      # no print
    "ERA",      # no commented-out code
    "S",        # bandit
]

# RUF012: Home Assistant entities set class attributes such as `_attr_hvac_modes = [...]` that
# are mutable by Ruff's reading; annotating them ClassVar satisfies Ruff but makes strict mypy
# reject the override of the base class's instance variable, so no form passes both.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
# cave_sim and cave_ops are the importable packages inside sim/ and ops/ (concept section 4.3);
# listing the directory names alone would classify them as third-party.
known-first-party = ["custom_components", "cave_sim", "cave_ops", "sim", "tools"]

# Shared per-directory ignores, also valid for ops/ and tests/ops, whose ruff.toml extends this file.
[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests state expectations; the others are fixtures, fake credentials and
# scratch paths in test code.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "S607"]
"sim/**" = ["S104", "S311"]  # control API binds 0.0.0.0 in its container; random sensor noise
"ops/**" = ["T201", "S603", "S607", "S310"]  # CLI prints, runs docker and git, uses urllib
"tools/**" = ["T201"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# custom_components has no __init__.py (see above), so name modules from the repository root.
explicit_package_bases = true
# sim/ is the base of the package cave_sim (concept section 4.3).
mypy_path = ".:sim"
# The paths to check are passed by `make typecheck`, which skips directories that
# do not exist yet (sim/ and tools/ arrive in later work packages) and checks ops/ separately.
exclude = ["^\\.venv/", "^\\.claude/", "^data/"]

# Home Assistant's modules do not re-export names explicitly, yet every integration imports
# `HVACMode`, `ClimateEntityFeature` and so on from the package. Our own code stays strict.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true

# paho-mqtt re-exports its enums without __all__; the test library ships no type information.
[[tool.mypy.overrides]]
module = ["paho.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
follow_untyped_imports = true
