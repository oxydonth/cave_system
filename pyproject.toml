[project]
name = "cave-system"
version = "0.0.0"
description = "Local-first home automation for a flat in Germany, heating first."
readme = "README.md"
# Home Assistant 2026.10.4 refuses anything below 3.14.2, and uv cannot resolve with ">=3.14".
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    # Pins Home Assistant 2026.10.4. Bump together with the image tag in compose.yaml.
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff",
    "mypy",
    "yamllint",
    # Pre-built ShellCheck and actionlint binaries, so no system packages are needed.
    "shellcheck-py",
    "actionlint-py",
]

[tool.uv]
# An application, not a distributable package: nothing here is built or installed.
package = false

[tool.pytest.ini_options]
# custom_components must be importable from the repository root. Do not add
# custom_components/__init__.py: Home Assistant's loader needs a namespace package.
pythonpath = ["."]
testpaths = ["tests"]
# importlib: test files in different directories may share a basename.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
# Tests that must also run on Python 3.11 (the planned ops/ package, standard library only) cannot
# use this file: the project does not install there, and --strict-config rejects asyncio_mode
# without pytest-asyncio. They run with a separate ini file and --confcutdir=tests/ops, for
# example `uv run --isolated --no-project --python 3.11 --with pytest pytest -c tests/ops/pytest.ini
# --confcutdir=tests/ops tests/ops`. That is why the root tests/conftest.py must not import
# Home Assistant: Home Assistant fixtures live in tests/cave_heating/conftest.py (and the
# integration test directories of later work packages).

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# Everything targets Python 3.14, except the planned ops/ package (the `cave` command-line tool),
# which must run on the server's system Python, 3.11 or newer, with the standard library only.
# When it arrives it gets its own ops/ruff.toml (`extend = "../pyproject.toml"` and
# `target-version = "py311"`; Ruff uses the closest config file) and a separate
# `mypy --python-version 3.11 ops` run in `make typecheck`. Nothing below is specific to 3.14
# apart from these two settings.
[tool.ruff]
target-version = "py314"
line-length = 100
# Anchored to the repository root: a bare "data" would also skip sim/cave_sim/data/ and the like.
extend-exclude = ["./.claude", "./data"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "RUF",      # ruff-specific
    "ASYNC",    # blocking calls in async code
    "T20",      # no print
    "ERA",      # no commented-out code
    "S",        # bandit
]

# RUF012: Home Assistant entities set class attributes such as `_attr_hvac_modes = [...]` that
# are mutable by Ruff's reading; annotating them ClassVar satisfies Ruff but makes strict mypy
# reject the override of the base class's instance variable, so no form passes both.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
# cave_sim and cave_ops are the importable packages inside sim/ and ops/ (concept section 4.3);
# listing the directory names alone would classify them as third-party.
known-first-party = ["custom_components", "cave_sim", "cave_ops", "sim", "tools"]

# Shared per-directory ignores. The ops/ entries can instead live in ops/ruff.toml, which also
# sets the older target version (see above).
[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests state expectations; the others are fixtures, fake credentials and
# scratch paths in test code.
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S311"]
"sim/**" = ["S104", "S311"]  # control API binds 0.0.0.0 in its container; random sensor noise
"ops/**" = ["T201", "S603", "S607", "S310"]  # CLI prints, runs docker and git, uses urllib
"tools/**" = ["T201"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# custom_components has no __init__.py (see above), so name modules from the repository root.
explicit_package_bases = true
mypy_path = "."
# The paths to check are passed by `make typecheck`, which skips directories that
# do not exist yet (sim/ and tools/ arrive in later work packages).
exclude = ["^\\.venv/", "^\\.claude/", "^data/"]

# Home Assistant's modules do not re-export names explicitly, yet every integration imports
# `HVACMode`, `ClimateEntityFeature` and so on from the package. Our own code stays strict.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
