# Generated by tools/render_dashboard.py from the applied heating.yaml by `./cave apply`.
# Do not edit: the next `./cave apply` overwrites this file.
title: Heating
views:
- title: Rooms
  path: rooms
  icon: mdi:radiator
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Home
      icon: mdi:home-thermometer
    - type: tile
      entity: select.cave_home_mode
      name:
        type: entity
      features:
      - type: select-options
        style: buttons
    - type: tile
      entity: number.cave_away_temperature
      name:
        type: entity
      features:
      - type: numeric-input
        style: buttons
    - type: tile
      entity: binary_sensor.cave_home_occupied
      name:
        type: entity
  - type: grid
    cards:
    - type: heading
      heading: Wohnzimmer
      icon: mdi:radiator
      badges:
      - type: entity
        entity: binary_sensor.cave_living_room_window_open
        show_state: true
      - type: entity
        entity: binary_sensor.cave_living_room_problem
        show_state: true
    - type: thermostat
      entity: climate.cave_living_room
      features:
      - type: climate-hvac-modes
        style: icons
      - type: climate-preset-modes
        style: dropdown
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.cave_living_room_reason
        name:
          type: entity
      - entity: binary_sensor.cave_living_room_window_open
        name:
          type: entity
      - entity: number.cave_living_room_comfort_temperature
        name:
          type: entity
      - entity: number.cave_living_room_eco_temperature
        name:
          type: entity
      - entity: button.cave_living_room_resume_schedule
        name:
          type: entity
      - entity: binary_sensor.wohnzimmer_fenster_contact
        name: Window contact
    - type: history-graph
      hours_to_show: 24
      entities:
      - climate.cave_living_room
      - sensor.wohnzimmer_temperature
      - sensor.wohnzimmer_humidity
  - type: grid
    cards:
    - type: heading
      heading: Schlafzimmer
      icon: mdi:radiator
      badges:
      - type: entity
        entity: binary_sensor.cave_bedroom_window_open
        show_state: true
      - type: entity
        entity: binary_sensor.cave_bedroom_problem
        show_state: true
    - type: thermostat
      entity: climate.cave_bedroom
      features:
      - type: climate-hvac-modes
        style: icons
      - type: climate-preset-modes
        style: dropdown
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.cave_bedroom_reason
        name:
          type: entity
      - entity: binary_sensor.cave_bedroom_window_open
        name:
          type: entity
      - entity: number.cave_bedroom_comfort_temperature
        name:
          type: entity
      - entity: number.cave_bedroom_eco_temperature
        name:
          type: entity
      - entity: button.cave_bedroom_resume_schedule
        name:
          type: entity
      - entity: binary_sensor.schlafzimmer_fenster_contact
        name: Window contact
    - type: history-graph
      hours_to_show: 24
      entities:
      - climate.cave_bedroom
      - sensor.schlafzimmer_temperature
      - sensor.schlafzimmer_humidity
  - type: grid
    cards:
    - type: heading
      heading: Bad
      icon: mdi:radiator
      badges:
      - type: entity
        entity: binary_sensor.cave_bathroom_window_open
        show_state: true
      - type: entity
        entity: binary_sensor.cave_bathroom_problem
        show_state: true
    - type: thermostat
      entity: climate.cave_bathroom
      features:
      - type: climate-hvac-modes
        style: icons
      - type: climate-preset-modes
        style: dropdown
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.cave_bathroom_reason
        name:
          type: entity
      - entity: binary_sensor.cave_bathroom_window_open
        name:
          type: entity
      - entity: number.cave_bathroom_comfort_temperature
        name:
          type: entity
      - entity: number.cave_bathroom_eco_temperature
        name:
          type: entity
      - entity: button.cave_bathroom_resume_schedule
        name:
          type: entity
    - type: history-graph
      hours_to_show: 24
      entities:
      - climate.cave_bathroom
      - sensor.bad_temperature
      - sensor.bad_humidity
- title: Maintenance
  path: maintenance
  icon: mdi:wrench
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Batteries
      icon: mdi:battery-heart
    - type: markdown
      content: |
        {% set ns = namespace(rows=[]) %}
        {% for s in states.sensor
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'battery') %}
        {% if is_number(s.state) %}
        {% set unit = s.attributes.unit_of_measurement | default('%', true) %}
        {% set ns.rows = ns.rows + [[s.state | float(0), s.name, s.state ~ ' ' ~ unit]] %}
        {% else %}
        {% set ns.rows = ns.rows + [[101, s.name, s.state]] %}
        {% endif %}
        {% endfor %}
        {% for s in states.binary_sensor
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'battery') %}
        {% set ns.rows = ns.rows + [[0 if s.state == 'on' else 102, s.name,
           'low' if s.state == 'on' else ('ok' if s.state == 'off' else s.state)]] %}
        {% endfor %}
        {% if ns.rows %}
        {% for row in ns.rows | sort(attribute='0') -%}
        - {{ row[1] }}: **{{ row[2] }}**
        {% endfor %}
        {% else %}
        No battery sensors known to Home Assistant.
        {% endif %}
  - type: grid
    cards:
    - type: heading
      heading: Unavailable devices
      icon: mdi:lan-disconnect
    - type: markdown
      content: |
        {% set ns = namespace(names=[]) %}
        {% for s in states | selectattr('state', 'eq', 'unavailable') %}
        {% set d = device_id(s.entity_id) %}
        {% if d %}
        {% set own = expand(device_entities(d)) %}
        {% set name = device_attr(d, 'name_by_user') or device_attr(d, 'name') %}
        {% if name and name not in ns.names and own | rejectattr('state', 'eq', 'unavailable')
           | list | count == 0 %}
        {% set ns.names = ns.names + [name] %}
        {% endif %}
        {% endif %}
        {% endfor %}
        {% if ns.names %}
        {% for name in ns.names | sort -%}
        - {{ name }}
        {% endfor %}
        {% else %}
        All devices are available.
        {% endif %}
  - type: grid
    cards:
    - type: heading
      heading: Rooms needing attention
      icon: mdi:alert-circle
    - type: markdown
      content: |
        {% set rooms = [
          ["binary_sensor.cave_living_room_problem", "Wohnzimmer"],
          ["binary_sensor.cave_bedroom_problem", "Schlafzimmer"],
          ["binary_sensor.cave_bathroom_problem", "Bad"],
        ] -%}
        {% set ns = namespace(shown=0) -%}
        {% for entity, name in rooms -%}
        {% set s = states(entity) -%}
        {% if s != 'off' -%}
        {% set ns.shown = ns.shown + 1 -%}
        {% if s == 'on' -%}
        **{{ name }}**: needs attention
        {% for message in state_attr(entity, 'messages') or [] -%}
        - {{ message }}
        {% endfor -%}
        {% for thermostat, status in (state_attr(entity, 'thermostats') or {}).items() -%}
        - {{ thermostat }}: {{ status }}
        {% endfor -%}
        {% else -%}
        **{{ name }}**: {{ s }}
        {% endif -%}
        {{ "\n" }}{% endif -%}
        {% endfor -%}
        {% if ns.shown == 0 -%}
        All rooms are ok.
        {% endif -%}
      entity_id:
      - binary_sensor.cave_living_room_problem
      - binary_sensor.cave_bedroom_problem
      - binary_sensor.cave_bathroom_problem
