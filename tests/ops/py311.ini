# pytest configuration for the Python 3.11 run of tests/ops (`make test-py311`). The root
# pyproject.toml cannot be used there: the project does not install on 3.11. Not named pytest.ini
# on purpose, see the note in pyproject.toml.
[pytest]
# Paths are relative to this file: cave_ops lives in ../../ops.
pythonpath = ../../ops
addopts = -ra --strict-markers --strict-config --import-mode=importlib
