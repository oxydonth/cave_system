name: CI

# This file only lists jobs. A larger check lives in its own reusable workflow file
# (stack.yml, sim.yml, e2e.yml, release.yml) and is added here as a short calling job that
# `ci-ok` also depends on. `ci-ok` is the one check to wait for: it fails when any other job
# does. Branch protection is unavailable here, so GitHub does not enforce it.

on:
  pull_request:
  push:
    branches: [main]

# Cancel a pull request's run when a newer commit supersedes it. Runs on main are never
# cancelled: each gets a group of its own. A shared group would not be enough, because GitHub
# also cancels a run that is merely pending when a newer one is queued in the same group.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('ci-pr-{0}', github.event.pull_request.number)
    || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.13.8"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - run: make setup
      - run: make lint
      - run: make typecheck
      - run: make versions

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - run: make setup
      - run: make test
      # The `cave` command must also run on the oldest Python it supports, without Home Assistant.
      - run: make test-py311

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs the official hassfest image directly instead of through home-assistant/actions,
    # whose action.yml uses the untagged :latest image: a new Home Assistant release could
    # then turn this job red with no change here. The Home Assistant version appears in
    # three places that move together, in one pull request: `homeassistant` in uv.lock
    # (through pytest-homeassistant-custom-component), the tag of this image, and the image
    # tag in compose.yaml. `make versions` (job lint) enforces it. The digest is the registry's
    # Docker-Content-Digest for the tag.
    env:
      HASSFEST_IMAGE: ghcr.io/home-assistant/hassfest:2026.10.4@sha256:e5828f7e305518506d8b4e8346411357d68358531b761bd118fe6a1631feff44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hassfest
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/github/workspace" "${HASSFEST_IMAGE}"

  stack:
    name: stack
    uses: ./.github/workflows/stack.yml

  sim:
    name: sim
    uses: ./.github/workflows/sim.yml

  e2e:
    name: e2e
    uses: ./.github/workflows/e2e.yml

  ci-ok:
    name: ci-ok
    # Fails when any job it depends on failed, was cancelled or was skipped, so it can be the
    # one check to wait for. The list of jobs is `needs`; it is the only place to edit.
    if: always()
    needs: [lint, test, hassfest, stack, sim, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every job to have succeeded
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null
