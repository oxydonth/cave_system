name: Stack

# The runtime stack from a clean checkout, with no interaction: the Compose file and the Home
# Assistant configuration are valid, the stack boots healthy in the pinned images, the broker
# lets in exactly those who know the generated password, and Home Assistant set up
# `cave_heating` without logging errors. Called from ci.yml; its jobs count towards `ci-ok`
# through the one calling job.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  stack:
    name: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise
        run: ./cave init

      - name: Nothing secret is tracked or left to be committed
        run: |
          status=$(git status --porcelain)
          if [ -n "${status}" ]; then
            echo "::error::init left files that Git does not ignore:"
            echo "${status}"
            exit 1
          fi
          test "$(stat -c '%a' .env)" = 600

      - name: A second init changes nothing
        run: |
          snapshot() { find .env data -printf '%p %y %m %s %T@\n' | sort; }
          snapshot > "${RUNNER_TEMP}/before"
          sleep 2
          ./cave init
          snapshot > "${RUNNER_TEMP}/after"
          diff "${RUNNER_TEMP}/before" "${RUNNER_TEMP}/after"

      - name: The Compose file is valid with and without the zigbee profile
        run: |
          docker compose config --quiet
          docker compose --profile zigbee config --quiet
          test "$(docker compose config --services | sort | tr '\n' ' ')" = "homeassistant mosquitto "
          test "$(docker compose --profile zigbee config --services | sort | tr '\n' ' ')" = \
            "homeassistant mosquitto zigbee2mqtt "

      - name: The Zigbee2MQTT image has the tool its health check uses
        run: |
          image=$(docker compose --profile zigbee config --images | grep zigbee2mqtt)
          docker run --rm --entrypoint sh "${image}" -c 'command -v wget'

      - name: Check the Compose file and the Home Assistant configuration
        run: ./cave check

      - name: Start the stack and wait until it is healthy
        run: ./cave up --timeout 420

      - name: Show the containers
        run: ./cave ps

      - name: The broker accepts the generated credentials and nobody else
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          subscribe() {
            docker compose exec -T mosquitto mosquitto_sub -h 127.0.0.1 -p 1883 \
              -t '$SYS/broker/version' -C 1 -W 5 "$@"
          }
          must_fail() {
            if "$@" > /dev/null 2>&1; then
              echo "::error::the broker accepted: $*"
              exit 1
            fi
          }
          echo "with the generated credentials:"
          subscribe -u "${CAVE_MQTT_USER}" -P "${CAVE_MQTT_PASSWORD}"
          echo "without credentials, with a wrong password, with an unknown user:"
          must_fail subscribe
          must_fail subscribe -u "${CAVE_MQTT_USER}" -P "not-the-password"
          must_fail subscribe -u "nobody" -P "${CAVE_MQTT_PASSWORD}"
          echo "the port is published on the host (Home Assistant reaches it there):"
          timeout 5 bash -c '</dev/tcp/127.0.0.1/1883'

      - name: Home Assistant finished starting
        run: |
          for _ in $(seq 1 90); do
            if docker compose logs --no-color --no-log-prefix homeassistant | grep -q 'Home Assistant initialized'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Home Assistant did not report that it finished starting"
          exit 1

      - name: Home Assistant set up cave_heating and logged no unexpected errors
        run: |
          # Give integrations that start in the background a moment to report.
          sleep 15
          # Home Assistant colours its log lines; remove the escape sequences before matching.
          docker compose logs --no-color --no-log-prefix homeassistant 2>&1 |
            sed 's/\x1b\[[0-9;]*m//g' > "${RUNNER_TEMP}/ha.log"
          grep -E 'Setting up cave_heating$' "${RUNNER_TEMP}/ha.log"

          # Log lines look like: 2026-11-15 12:00:00.000 ERROR (MainThread) [logger] message.
          # If Home Assistant changed that format, the error filter below would find nothing
          # and pass without looking, so insist that the format is still recognised.
          line_format='^[0-9-]+ [0-9:.]+ (DEBUG|INFO|WARNING|ERROR|CRITICAL) '
          lines=$(grep -cE "${line_format}" "${RUNNER_TEMP}/ha.log" || true)
          if [ "${lines}" -lt 10 ]; then
            echo "::error::only ${lines} log lines match the expected format; has Home Assistant's log format changed?"
            exit 1
          fi

          # Errors that are expected on a GitHub runner or in a stack without devices. Every
          # entry is an extended regular expression matched against the whole log line, and
          # says why it is harmless. Anything else that Home Assistant logs as ERROR or
          # CRITICAL fails the job. Do not add an entry without a reason. There is none now:
          # the integrations that complain about a missing Bluetooth adapter, USB or D-Bus
          # (bluetooth, usb) are not loaded (homeassistant/configuration.yaml).
          allowed=(
            '^$'
          )

          grep -E '^[0-9-]+ [0-9:.]+ (ERROR|CRITICAL) ' "${RUNNER_TEMP}/ha.log" > "${RUNNER_TEMP}/errors.log" || true
          for pattern in "${allowed[@]}"; do
            grep -vE "${pattern}" "${RUNNER_TEMP}/errors.log" > "${RUNNER_TEMP}/errors.next" || true
            mv "${RUNNER_TEMP}/errors.next" "${RUNNER_TEMP}/errors.log"
          done
          if [ -s "${RUNNER_TEMP}/errors.log" ]; then
            echo "::error::Home Assistant logged errors that are not on the allow-list:"
            cat "${RUNNER_TEMP}/errors.log"
            exit 1
          fi
          echo "no unexpected errors in $(wc -l < "${RUNNER_TEMP}/ha.log") log lines"

      - name: apply turns the starter configuration into the heating dashboard
        # The real validator and the real dashboard generator, each in a one-off container of the
        # pinned image. There is no script token in the pipeline (`cave bootstrap` creates it),
        # so apply must say that Home Assistant has to be restarted, and still succeed.
        run: |
          dashboard=data/homeassistant/dashboards/heating.yaml
          grep -q '^# Placeholder until' "${dashboard}"

          ./cave apply | tee "${RUNNER_TEMP}/apply.txt"
          grep -q 'Applied copy:    unchanged' "${RUNNER_TEMP}/apply.txt"
          grep -q 'Dashboard:       regenerated' "${RUNNER_TEMP}/apply.txt"
          grep -q 'has to be restarted instead' "${RUNNER_TEMP}/apply.txt"

          if grep -q 'Placeholder until' "${dashboard}"; then
            echo "::error::the dashboard is still the placeholder"
            exit 1
          fi
          head -n 1 "${dashboard}" | grep -q '^# Generated by tools/render_dashboard.py'
          docker compose run --rm --no-deps -T --entrypoint python3 homeassistant -c '
          import sys, yaml
          dashboard = yaml.safe_load(open("/config/dashboards/heating.yaml"))
          paths = [view["path"] for view in dashboard["views"]]
          assert paths == ["rooms", "maintenance"], paths
          print("dashboard parses, views:", paths)
          '

          # The starter has no rooms: the room view says so, and a second apply changes nothing.
          grep -q 'No rooms are configured yet' "${dashboard}"
          sha256sum "${dashboard}" > "${RUNNER_TEMP}/dashboard.sha"
          ./cave apply
          sha256sum --check "${RUNNER_TEMP}/dashboard.sha"

      - name: apply refuses an invalid file and changes nothing
        run: |
          applied=data/homeassistant/cave/.applied/heating.yaml
          dashboard=data/homeassistant/dashboards/heating.yaml
          sha256sum "${applied}" "${dashboard}" > "${RUNNER_TEMP}/before.sha"
          printf 'version: 1\nrooms:\n  - id: Not A Slug\n' >> data/homeassistant/cave/heating.yaml
          if ./cave apply > "${RUNNER_TEMP}/apply-invalid.txt" 2>&1; then
            echo "::error::apply accepted an invalid file"
            cat "${RUNNER_TEMP}/apply-invalid.txt"
            exit 1
          fi
          cat "${RUNNER_TEMP}/apply-invalid.txt"
          grep -q 'Nothing was changed' "${RUNNER_TEMP}/apply-invalid.txt"
          sha256sum --check "${RUNNER_TEMP}/before.sha"

      - name: The broker logged no warning or error
        # Mosquitto 2.0 warns about a password file with wrong ownership or permissions, and
        # logs a client that could not log in at notice level, which is not matched here.
        run: |
          docker compose logs --no-color --no-log-prefix mosquitto > "${RUNNER_TEMP}/mosquitto.log"
          if grep -E '(Warning|Error):' "${RUNNER_TEMP}/mosquitto.log"; then
            echo "::error::Mosquitto logged warnings or errors"
            exit 1
          fi

      - name: Logs of every service, when something failed
        if: failure()
        run: ./cave logs --tail all || true

      - name: Stop the stack
        if: always()
        run: ./cave down

  provision-dry-run:
    name: provision-host dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dry run prints the plan and changes nothing
        run: |
          before=$(getent passwd | cut -d: -f1 | sort | tr '\n' ' ')
          ./scripts/provision-host.sh --dry-run | tee "${RUNNER_TEMP}/plan.txt"
          grep -q 'Dry run finished: nothing was changed.' "${RUNNER_TEMP}/plan.txt"
          grep -q 'docker-ce' "${RUNNER_TEMP}/plan.txt"
          test "$(getent passwd | cut -d: -f1 | sort | tr '\n' ' ')" = "${before}"
          if getent passwd cave; then
            echo "::error::the dry run created the service user"
            exit 1
          fi
          test ! -e /etc/apt/sources.list.d/docker.sources
          test ! -e /var/lib/cave
          test ! -e /opt/cave
