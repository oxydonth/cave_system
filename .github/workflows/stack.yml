name: Stack

# The stack check on its own, on demand: `gh workflow run stack.yml --ref <branch>`. It costs the
# minutes of this one check instead of a whole pipeline run, when only the stack is in question.
#
# The check itself is the composite action .github/actions/stack: the runtime stack from a clean
# checkout, with no interaction. The pipeline (ci.yml) does not call this file: it runs the same
# action as the first part of the job in e2e.yml, so that the images are pulled once and one job
# is billed instead of three (work package 16).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    name: stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runtime stack
        uses: ./.github/actions/stack
