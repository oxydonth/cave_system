name: End-to-end

# Every check that needs containers, in one job, so that it is billed once and the images are
# pulled once (work package 16). One part after the other; the first that fails ends the job:
#
# - The stack check (.github/actions/stack): the runtime stack from a clean checkout, `./cave
#   check`, the broker's credentials, Home Assistant's log, `./cave apply` in the pinned image.
# - The simulator check (.github/actions/sim): the simulator image against a real broker.
# - Back to a clean checkout: the stack check's state is removed, and the checkout must then be as
#   clean as a fresh one, so that the first-run setup below starts from nothing.
# - The end-to-end check, below.
#
# stack.yml and sim.yml run the first two on their own, on demand.
#
# The end-to-end check: the complete system from a clean checkout (concept section 8, end-to-end
# level), in two parts:
#
# 1. First-run setup on the home's stack: `./cave init`, `./cave up`, then tests/e2e/
#    test_first_run.py runs `./cave bootstrap`, checks the result through Home Assistant's API
#    with the stored script token, runs it again and proves that nothing changed, also after a
#    deleted token file, a revoked token, a changed owner password and a restart.
# 2. The demo: `./cave demo` (the stack with simulated devices, a Compose project and state of its
#    own), then tests/e2e/test_scenarios.py: schedule, window pause, away, boost, room-sensor feed,
#    a slow FRITZ! thermostat, a dial, offline devices, across both device families. Before the
#    scenarios, tests/e2e/test_dashboard_browser.py opens the heating dashboard in a real browser
#    (rooms and maintenance view, at a desktop and a phone width) and fails if any card shows an
#    error; its screenshots are kept as an artifact for three days. The upload works since the
#    repository is public (23 November 2026); while it was private the account's artifact storage
#    was full and the upload was refused. Should an upload fail again, it does not fail the job, and
#    the screenshots are printed into the job log as base64 instead (tests/e2e/print-screenshots.sh
#    says how to get them back).
#
# Called from ci.yml; its job counts towards `ci-ok` through the one calling job.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: stack, sim, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pytest and aiohttp for tests/e2e. The version equals UV_VERSION in ci.yml; a reusable
      # workflow does not see that file's env.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true

      - run: make setup

      # --- the browser for the dashboard check, installed while the images are pulled
      - name: Which Playwright the tests use
        id: playwright
        run: |
          version=$(uv run --locked python -c 'from importlib.metadata import version; print(version("playwright"))')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Each Playwright version installs one fixed build of the browser, so the browser is cached
      # under that version and downloaded only when the version changes. Playwright checks what it
      # finds and downloads whatever is missing; a damaged browser does not start, which fails the
      # dashboard check. Only the browser is cached: the system libraries come from apt every time.
      - name: The browser from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the browser, in the background
        # Chromium's headless shell with the system libraries it needs, about half a minute of apt
        # that would otherwise hold up the job. It runs while the images are pulled and the stack
        # starts; "Wait for the browser" below waits for it and fails if it failed. The background
        # process writes only to its own files, so this step ends at once.
        run: |
          (
            status=0
            uv run --locked playwright install --with-deps --only-shell chromium || status=$?
            echo "${status}" > "${RUNNER_TEMP}/browser.status"
          ) > "${RUNNER_TEMP}/browser.log" 2>&1 < /dev/null &

      # --- the stack check and the simulator check
      - name: The runtime stack
        uses: ./.github/actions/stack

      - name: The simulator against a real broker
        uses: ./.github/actions/sim

      - name: Back to a clean checkout
        # The stack check leaves the stopped stack's state; files Home Assistant wrote belong to
        # root. Without that state the checkout is a fresh one plus ignored caches (.venv,
        # __pycache__), which the end-to-end job always had; the step checks it.
        run: |
          sudo rm -rf data .env
          # Every change, untracked and ignored file, except the caches named.
          left=$(git status --porcelain --ignored |
            grep -vE '^!! (\.venv/|(.*/)?(__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache)/)$' || true)
          if [ -n "${left}" ]; then
            echo "::error::the checks before left files behind:"
            echo "${left}"
            exit 1
          fi
          if [ -n "$(docker ps --all --quiet)" ]; then
            echo "::error::the checks before left containers behind:"
            docker ps --all
            exit 1
          fi

      - name: Where the demo keeps its state (`./cave demo`'s default)
        run: echo "DEMO_DATA=${XDG_STATE_HOME:-${HOME}/.local/state}/cave/demo" >> "${GITHUB_ENV}"

      # --- part 1: first-run setup on the home's stack
      - name: Initialise
        run: |
          ./cave init
          # From here on the runner masks every generated secret in the job log.
          tests/e2e/mask-secrets.sh .env

      - name: Pull the images
        run: docker compose pull --quiet

      - name: Start the stack and wait until it is healthy
        run: ./cave up --timeout 420

      - name: First-run setup, checked through Home Assistant's API, and run again
        env:
          CAVE_E2E: home
        # -s: the output of every ./cave run is part of the job log.
        run: uv run --locked pytest tests/e2e/test_first_run.py -v -s -p no:cacheprovider

      - name: Home Assistant logged no unexpected errors (home)
        run: tests/e2e/check-ha-log.sh

      - name: Stop the home's stack, which uses the same ports as the demo
        run: ./cave down

      # --- part 2: the demo and the scenarios
      - name: Start the demo
        run: |
          # The demo's secrets are made here and masked before `./cave demo` runs, which keeps
          # every value its demo.env already has and adds the rest.
          mkdir -p "${DEMO_DATA}"
          (
            umask 077
            for name in CAVE_MQTT_PASSWORD CAVE_HA_OWNER_PASSWORD CAVE_Z2M_FRONTEND_TOKEN \
              CAVE_FRITZ_PASSWORD; do
              echo "${name}=$(openssl rand -hex 16)"
            done > "${DEMO_DATA}/demo.env"
          )
          tests/e2e/mask-secrets.sh "${DEMO_DATA}/demo.env"
          cp "${DEMO_DATA}/demo.env" "${RUNNER_TEMP}/demo-secrets"
          ./cave demo --timeout 420
          # Kept, not replaced: the masked secrets are the ones the demo uses.
          while read -r line; do
            grep -qxF "${line}" "${DEMO_DATA}/demo.env"
          done < "${RUNNER_TEMP}/demo-secrets"
          tests/e2e/mask-secrets.sh "${DEMO_DATA}/demo.env" "${DEMO_DATA}/homeassistant/.cave/token"

      # --- the heating dashboard in a browser
      - name: Wait for the browser
        run: |
          for _ in $(seq 600); do
            [ -s "${RUNNER_TEMP}/browser.status" ] && break
            sleep 1
          done
          echo "::group::Installing the browser"
          cat "${RUNNER_TEMP}/browser.log" || true
          echo "::endgroup::"
          status=$(cat "${RUNNER_TEMP}/browser.status" 2> /dev/null || echo "none: it did not finish in ten minutes")
          if [ "${status}" != 0 ]; then
            echo "::error::installing the browser failed, exit status ${status}"
            exit 1
          fi

      - name: The heating dashboard in a browser
        env:
          CAVE_E2E: demo
          CAVE_E2E_SCREENSHOTS: ${{ runner.temp }}/screenshots
        # The first test is the check; the others show that its detector tells a broken
        # dashboard from a working one, and that the screenshots survive the job log.
        run: |
          uv run --locked pytest tests/e2e/test_dashboard_browser.py \
            tests/e2e/test_extract_screenshots.py -v -s -p no:cacheprovider

      - name: Upload the screenshots
        id: upload_screenshots
        if: always()
        # An upload that fails (the artifact storage was full while the repository was private)
        # must not fail the job. The step after this one then puts the screenshots into the log.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Screenshots in the job log, when the upload did not succeed
        if: always() && steps.upload_screenshots.outcome != 'success'
        run: tests/e2e/print-screenshots.sh "${RUNNER_TEMP}/screenshots/log"

      # --- the scenarios
      - name: The scenarios on the demo
        env:
          CAVE_E2E: demo
        run: uv run --locked pytest tests/e2e/test_scenarios.py -v -s -p no:cacheprovider

      - name: Home Assistant logged no unexpected errors (demo)
        run: |
          tests/e2e/check-ha-log.sh -p cave-demo -f compose.yaml -f compose.sim.yaml \
            --env-file "${DEMO_DATA}/demo.env"

      # --- when something failed
      - name: Logs, when something failed
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/logs"
          ./cave logs --tail all > "${RUNNER_TEMP}/logs/home.log" 2>&1 || true
          if [ -f "${DEMO_DATA}/demo.env" ]; then
            docker compose -p cave-demo -f compose.yaml -f compose.sim.yaml \
              --env-file "${DEMO_DATA}/demo.env" logs --no-color --tail all \
              > "${RUNNER_TEMP}/logs/demo.log" 2>&1 || true
          fi
          # The runner masks what it prints; the files kept as the artifact are masked here.
          for file in .env "${DEMO_DATA}/demo.env"; do
            [ -f "${file}" ] || continue
            grep -E '^CAVE_(MQTT_PASSWORD|HA_OWNER_PASSWORD|Z2M_FRONTEND_TOKEN|FRITZ_PASSWORD)=' "${file}" |
              cut -d= -f2- | while read -r secret; do
                # `if`, not `&&`: an empty secret (the FRITZ!Box password of a home without one)
                # would otherwise make the loop, and with it the step, fail under `bash -e`, so
                # that the logs of a failed run were neither masked nor printed.
                if [ -n "${secret}" ]; then
                  sed -i "s/${secret}/********/g" "${RUNNER_TEMP}"/logs/*.log
                fi
              done
          done
          # The artifact store of the account may be full, so the essentials go into the job
          # log as well.
          for file in "${RUNNER_TEMP}"/logs/*.log; do
            echo "::group::$(basename "${file}"): warnings and errors"
            grep -E 'WARNING|ERROR|CRITICAL|Traceback' "${file}" | tail -300 || true
            echo "::endgroup::"
          done

      - name: Upload the logs, when something failed
        if: failure()
        # An upload that fails (the artifact storage was full while the repository was private)
        # must not hide the real failure.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/logs
          retention-days: 7

      - name: Stop everything
        if: always()
        run: |
          ./cave demo down || true
          ./cave down || true
