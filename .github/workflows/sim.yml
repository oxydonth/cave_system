name: sim

# The simulator check on its own, on demand: `gh workflow run sim.yml --ref <branch>`. It costs the
# minutes of this one check instead of a whole pipeline run, when only the simulator is in question.
#
# The check itself is the composite action .github/actions/sim: it builds the simulator image and
# runs it against a real Mosquitto. The pipeline (ci.yml) does not call this file: it runs the same
# action as a part of the job in e2e.yml, which builds the same image for the demo anyway.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    name: sim
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The simulator against a real broker
        uses: ./.github/actions/sim
