# Weekly update proposals, one grouped pull request per ecosystem. Each goes through the
# normal pipeline and review. The docker and docker-compose entries match every directory,
# so the Compose files and the sim/ Dockerfile are covered when later work packages add them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/**/*"]
    schedule:
      interval: weekly
    # The Home Assistant image tag must always equal the homeassistant version pinned through
    # pytest-homeassistant-custom-component, and both are bumped together in one pull request
    # by hand. A check for this arrives with the runtime stack work package.
    ignore:
      - dependency-name: ghcr.io/home-assistant/home-assistant
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/**/*"]
    schedule:
      interval: weekly
    groups:
      dockerfiles:
        patterns: ["*"]
