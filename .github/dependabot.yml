# Weekly update proposals, one grouped pull request per ecosystem. Each goes through the
# normal pipeline and review. The docker and docker-compose entries match every directory,
# so the Compose files and the sim/ Dockerfile are covered when later work packages add them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/**/*"]
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/**/*"]
    schedule:
      interval: weekly
    groups:
      dockerfiles:
        patterns: ["*"]
