# Weekly update proposals, one grouped pull request per ecosystem. Each goes through the
# normal pipeline and review.
#
# Home Assistant is never bumped by Dependabot. Its version appears in three places that move
# together, by hand, in one pull request: `homeassistant` in uv.lock (through
# pytest-homeassistant-custom-component), the hassfest image tag in ci.yml, and the image tag
# in compose.yaml. The check that enforces it arrives with the runtime stack work package.
# The image is listed under every name it can be written with, in both container ecosystems.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Only the tools this repository chooses itself. Everything else in the dev group is pinned
  # exactly, directly or through its dependencies, by the test library
  # pytest-homeassistant-custom-component or by Home Assistant: pytest, pytest-cov, paho-mqtt,
  # pyfritzhome, aiohttp, pyyaml and the rest move only together with Home Assistant, in the same
  # pull request as the test library. A bump of any of them on its own cannot be resolved; that is
  # why the weekly job failed for pytest. With `allow`, Dependabot considers only the names listed;
  # a name that is both allowed and ignored is ignored, so the `ignore` entries below are a second
  # guard should one of them ever be added to `allow` by mistake.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: types-pyyaml
      - dependency-name: yamllint
      - dependency-name: shellcheck-py
      - dependency-name: actionlint-py
    ignore:
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: homeassistant
      - dependency-name: paho-mqtt
      - dependency-name: pyfritzhome
    groups:
      python:
        patterns: ["*"]

  # "/" for the Compose files at the repository root (compose.yaml, compose.sim.yaml); "/**/*" for
  # Dockerfiles below it, such as sim/Dockerfile. A `**` glob does not match the root itself.
  - package-ecosystem: docker-compose
    directories: ["/", "/**/*"]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ghcr.io/home-assistant/home-assistant
      - dependency-name: homeassistant/home-assistant
      - dependency-name: home-assistant/home-assistant
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/**/*"]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ghcr.io/home-assistant/home-assistant
      - dependency-name: homeassistant/home-assistant
      - dependency-name: home-assistant/home-assistant
    groups:
      dockerfiles:
        patterns: ["*"]
